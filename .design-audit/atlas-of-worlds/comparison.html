<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atlas of Worlds visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #111; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 18px; font-size: 18px; font-weight: 600; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      figure { margin: 0; }
      figcaption { display: flex; justify-content: space-between; margin-bottom: 7px; color: #c8c2b6; }
      img { display: block; width: 100%; height: auto; border: 1px solid #555; background: #eee; }
    </style>
  </head>
  <body>
    <h1>Atlas of Worlds · Moon · Light theme · 1490 × 1058</h1>
    <main>
      <figure>
        <figcaption><strong>Approved visual target</strong><span>Reference</span></figcaption>
        <img src="target.png" alt="Approved Atlas of Worlds target" />
      </figure>
      <figure>
        <figcaption><strong>Implemented prototype</strong><span>Browser capture</span></figcaption>
        <img src="implementation-matched.png" alt="Implemented Atlas of Worlds prototype" />
      </figure>
    </main>
  </body>
</html>
